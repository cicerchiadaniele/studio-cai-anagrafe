<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servizio in Arrivo - Centro Amministrazione Immobili</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #6b001a 0%, #800020 50%, #a0002a 100%);
            position: relative;
            overflow: hidden;
        }
        
        .gradient-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
        }
        
        .bordeaux-text {
            color: #800020;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <div class="gradient-bg text-white py-6">
        <div class="max-w-4xl mx-auto px-6">
            <div class="bg-white rounded-2xl shadow-xl p-6 mx-auto" style="max-width: 500px;">
                <img src="logo-cai.jpg" alt="Centro Amministrazione Immobili" class="w-full h-auto" />
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="max-w-2xl w-full text-center fade-in">
            
            <!-- Icon -->
            <div class="mb-8 flex justify-center">
                <div class="w-24 h-24 rounded-full flex items-center justify-center animate-pulse-slow" style="background: linear-gradient(135deg, #800020 0%, #a0002a 100%);">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Title -->
            <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
                Servizio in Arrivo
            </h1>
            
            <!-- Subtitle -->
            <p class="text-xl text-gray-600 mb-8">
                Stiamo lavorando per voi
            </p>
            
            <!-- Message -->
            <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
                <p class="text-lg text-gray-700 leading-relaxed mb-4">
                    Questo servizio sarà <strong class="bordeaux-text">prossimamente disponibile</strong>.
                </p>
                <p class="text-gray-600">
                    Il nostro team sta lavorando per rendere disponibile questo servizio il prima possibile.
                </p>
            </div>
            
            <!-- Progress Indicator -->
            <div class="mb-8">
                <div class="flex items-center justify-center space-x-2">
                    <div class="w-3 h-3 rounded-full animate-pulse-slow" style="background-color: #800020; animation-delay: 0s;"></div>
                    <div class="w-3 h-3 rounded-full animate-pulse-slow" style="background-color: #800020; animation-delay: 0.3s;"></div>
                    <div class="w-3 h-3 rounded-full animate-pulse-slow" style="background-color: #800020; animation-delay: 0.6s;"></div>
                </div>
            </div>
            
            <!-- Back Button -->
            <a href="index.html" class="inline-flex items-center px-8 py-4 text-white font-semibold rounded-xl shadow-lg transition-all duration-300 hover:shadow-xl hover:scale-105" style="background: linear-gradient(135deg, #800020 0%, #a0002a 100%);">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Torna al Portale Servizi
            </a>
            
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-6xl mx-auto px-6 py-6 text-center">
            <p class="text-gray-600 text-sm">
                <strong>Centro Amministrazione Immobili</strong>
            </p>
            <p class="text-gray-500 text-xs mt-2">
                <a href="https://www.studiocai.it" target="_blank" class="hover:text-gray-700 hover:underline">www.studiocai.it</a>
            </p>
        </div>
    </footer>
</body>
</html>
